[project]
name = "polaris-dev-scripts"
version = "0.0.0"
description = "Dev tooling for the polaris-project monorepo (build/up/down + lib)."
requires-python = ">=3.11"
dependencies = [
    "questionary>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
