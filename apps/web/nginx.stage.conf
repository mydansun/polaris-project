# nginx config for the staging web bundle.  Served by the
# `nginxinc/nginx-unprivileged` base image, which runs as uid 101 and
# listens on :8080 (Traefik upstreams point here).
#
# SPA fallback: any path that doesn't match a real file under
# /usr/share/nginx/html falls through to index.html so the React
# router can handle it client-side.

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset bundles — long cache, immutable.  Vite emits them
    # under /assets/ with content hashes in the filename.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else: try as a static file, then directory index, then
    # fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
